spring.application.name=userservice
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}

jwt.secret=${JWT_SECRET}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration



auth.service.base-url=${AUTH_SERVICE_BASE_URL:http://auth-service:8080}
post.service.base-url=${POST_SERVICE_BASE_URL:http://post-service:8080}
notification.service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://notification-service:8080}
