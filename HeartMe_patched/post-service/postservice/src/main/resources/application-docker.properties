spring.application.name=postservice
server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}

jwt.secret=${JWT_SECRET}

# Opcional: se não setar, o post-service sobe sem integração de imagens
unsplash.api.key=${UNSPLASH_API_KEY:}

# user-service
user.service.base-url=${USER_SERVICE_BASE_URL:${USER_SERVICE_BASEURL:http://user-service:8081}}

# notification
notification.enabled=${NOTIFICATION_ENABLED:false}
notification.baseUrl=${NOTIFICATION_BASE_URL:${NOTIFICATION_BASEURL:http://notification-service:8083}}
