spring.application.name=postservice
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/heartme_db_patched
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Garante que Hibernate use o schema posts
spring.jpa.properties.hibernate.default_schema=posts

# JWT
jwt.secret=minhaChaveSuperSecretaComMaisDe32Bytes123!
jwt.expirationMinutes=60

# Notification (futuro microserviço via WebSocket)
notification.enabled=${NOTIFICATION_ENABLED:false}
notification.baseUrl=${NOTIFICATION_BASE_URL:${NOTIFICATION_BASEURL:http://localhost:8083}}

# Se você não definir a variável de ambiente UNSPLASH_API_KEY, o serviço ainda sobe.
# (Apenas não vai conseguir buscar imagens no Unsplash.)
unsplash.api.key=${UNSPLASH_API_KEY:}

user.service.base-url=${USER_SERVICE_BASE_URL:${USER_SERVICE_BASEURL:http://localhost:8081}}
